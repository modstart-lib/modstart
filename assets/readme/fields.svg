      <rect x="805" y="344" width="95" height="32" rx="8" fill="#FFFFFF" stroke="#E4E7EC"/>
      <text x="819" y="366" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" fill="#344054">custom</text>
