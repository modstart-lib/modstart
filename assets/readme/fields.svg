      <text x="295" y="366" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" fill="#344054">keyValueList</text>
      <rect x="449" y="344" width="170" height="32" rx="8" fill="#FFFFFF" stroke="#E4E7EC"/>
      <text x="463" y="366" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" fill="#344054">complexFields</text>
