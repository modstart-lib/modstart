<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="fldTitle fldDesc">
  <title id="fldTitle">ModStart 内置的 58 种字段类型</title>
  <desc id="fldDesc">按文本、数字与时间、选择与关联、媒体与文件、结构与组合分组的字段类型示例，每行末尾标出该组未列出的数量。</desc>

  <rect width="1200" height="420" rx="26" fill="#F5F7FB"/>

  <g id="caption" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif">
    <text x="56" y="92" font-size="24" font-weight="600" fill="#101828">58 种内置字段类型</text>
    <text x="56" y="124" font-size="18" fill="#667085">字段在 field() 里按名字声明，表格、表单、详情页共用同一份定义</text>
  </g>
  <g id="field-rows">
    <g id="row-1">
      <text x="56" y="182" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Noto Sans CJK SC', sans-serif" font-size="18" fill="#475467">文本与内容</text>
      <rect x="200" y="160" width="73" height="32" rx="8" fill="#FFFFFF" stroke="#E4E7EC"/>
      <text x="214" y="182" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" fill="#344054">text</text>
      <rect x="281" y="160" width="116" height="32" rx="8" fill="#FFFFFF" stroke="#E4E7EC"/>
      <text x="295" y="182" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" fill="#344054">textarea</text>
      <rect x="405" y="160" width="116" height="32" rx="8" fill="#FFFFFF" stroke="#E4E7EC"/>
      <text x="419" y="182" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" fill="#344054">password</text>
      <rect x="529" y="160" width="116" height="32" rx="8" fill="#FFFFFF" stroke="#E4E7EC"/>
      <text x="543" y="182" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" fill="#344054">richHtml</text>
      <rect x="653" y="160" width="116" height="32" rx="8" fill="#FFFFFF" stroke="#E4E7EC"/>
      <text x="667" y="182" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" fill="#344054">markdown</text>
      <rect x="777" y="160" width="73" height="32" rx="8" fill="#FFFFFF" stroke="#E4E7EC"/>
      <text x="791" y="182" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" fill="#344054">code</text>
      <rect x="858" y="160" width="73" height="32" rx="8" fill="#FFFFFF" stroke="#E4E7EC"/>
      <text x="872" y="182" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" fill="#344054">html</text>
      <rect x="939" y="160" width="62" height="32" rx="8" fill="#FFFFFF" stroke="#E4E7EC"/>
      <text x="953" y="182" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" fill="#344054">raw</text>
    </g>
    <g id="row-2">
